name: Build Aniyomi Extension APK

on:
  workflow_dispatch:
  push:
    paths:
      - "src/ar/egydead/**"
      - ".github/workflows/build-extension.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this extension
        uses: actions/checkout@v4
        with:
          path: custom-extension

      - name: Checkout Aniyomi extensions repo
        uses: actions/checkout@v4
        with:
          repository: aniyomiorg/aniyomi-extensions
          path: aniyomi-extensions

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Copy EgyDead source into build repo
        run: |
          rm -rf aniyomi-extensions/src/ar/egydead
          mkdir -p aniyomi-extensions/src/ar
          cp -R custom-extension/src/ar/egydead aniyomi-extensions/src/ar/egydead

      - name: Build APK
        working-directory: aniyomi-extensions
        run: |
          chmod +x ./gradlew
          ./gradlew :src:ar:egydead:assembleRelease || ./gradlew assembleRelease

      - name: Collect APK
        run: |
          mkdir -p output
          find aniyomi-extensions -type f -name "*.apk" -path "*egydead*" -print -exec cp {} output/ \;
          find output -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: egydead-extension-apk
          path: output/*.apk
          if-no-files-found: error
